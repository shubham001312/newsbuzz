# ============================================================
#  netlify.toml — Deploy config for Netlify (free hosting)
#  Just drag the newsbuzz/ folder onto netlify.com
# ============================================================

[build]
  publish = "."

# ── Security headers ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── Cache static assets ───────────────────────────────────────
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ── SPA redirect (all routes → index.html) ───────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
